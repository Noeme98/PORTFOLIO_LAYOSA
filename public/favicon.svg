<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nflGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background Shield/Badge -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)" stroke="url(#nflGradient)" stroke-width="20"/>

  <!-- Geometric Tech Circuit Overlay -->
  <circle cx="120" cy="120" r="16" fill="#0ea5e9" opacity="0.8"/>
  <line x1="120" y1="120" x2="200" y2="120" stroke="#0ea5e9" stroke-width="6" opacity="0.5"/>
  <circle cx="392" cy="392" r="16" fill="#10b981" opacity="0.8"/>
  <line x1="312" y1="392" x2="392" y2="392" stroke="#10b981" stroke-width="6" opacity="0.5"/>

  <!-- Monogram Logo text: NFL -->
  <text x="256" y="310" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="190" 
        fill="url(#nflGradient)" 
        text-anchor="middle" 
        letter-spacing="-6">NFL</text>
</svg>
